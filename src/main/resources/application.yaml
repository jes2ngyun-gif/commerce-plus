spring:
  config:
    import: "optional:aws-parameterstore:/config/commerceplus_prod/"
  application:
    name: commerceplus
  

  # redis (Docker redis-container, 호스트 6379 → 컨테이너 6379)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  # 도커 컴포즈 가상 네트워크 환경에 대응하도록 URL 주소 최적화
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/commerceplus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: 60000
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

portone:
  base-url: "https://api.portone.io"
  store-id: "store-82b5d935-d16d-45b1-a309-65042af5317d"
  channel-key: "channel-key-ca97e191-c472-436a-ac5a-c6bd4bfd24f8"
  api-secret: ${portone_api-secret}

jwt:
  expiration: 3600000 # 1시간 (ms)
  secret: ${jwt_secret}
